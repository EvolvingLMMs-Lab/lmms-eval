name: PR E2E Evidence

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-e2e-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-e2e-evidence:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target must only execute trusted repository code.
      # Never check out the contributor's head/merge ref or execute PR commands.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/pr-evidence
      - name: Require E2E evidence for new and existing evaluation code
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/pr-evidence/validate.cjs');
            await run({ github, context, core });
