dataset_path: Jayant-Sravan/CountQA
dataset_kwargs:
  revision: f92cc6fe46542c61e2916e3d2ae9a911e2216b1a
task: "countqa"
test_split: test
output_type: generate_until
process_docs: !function utils.countqa_process_docs
doc_to_visual: !function utils.countqa_doc_to_visual
doc_to_text: !function utils.countqa_doc_to_text
doc_to_target: "answer"
process_results: !function utils.countqa_process_results
metric_list:
  - metric: countqa_acc
    aggregation: !function utils.countqa_aggregate_acc
    higher_is_better: true
  - metric: countqa_off_by_one_acc
    aggregation: !function utils.countqa_aggregate_off_by_one_acc
    higher_is_better: true
  - metric: countqa_focused_acc
    aggregation: !function utils.countqa_aggregate_focused_acc
    higher_is_better: true
  - metric: countqa_unfocused_acc
    aggregation: !function utils.countqa_aggregate_unfocused_acc
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with a single number."
metadata:
  version: 0.0
