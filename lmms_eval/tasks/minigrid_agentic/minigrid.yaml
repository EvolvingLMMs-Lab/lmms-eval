dataset_path: json
dataset_kwargs:
  data_files:
    test: data/minigrid.jsonl
task: "minigrid"
test_split: test
output_type: generate_until_agentic
stateful: true
reasoning_tags: none
doc_to_messages: !function utils.minigrid_doc_to_messages
doc_to_text: !function utils.minigrid_doc_to_text
doc_to_target: !function utils.minigrid_doc_to_target
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
  max_agentic_steps: 40
process_results: !function utils.minigrid_process_results
metric_list:
  - metric: minigrid_success
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: true
  - metric: minigrid_steps
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: false
  - metric: minigrid_invalid_actions
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: false
  - metric: minigrid_env_error
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  version: 0.2
  description: "MiniGrid task using the standard agentic generation loop"
