# Docs-from-code: the "dataset" is a scenario list defined in utils.py, so
# there is no tracked data file and no hub dependency.
dataset_path: !function utils.minigrid_dataset
task: "minigrid"
test_split: test
output_type: generate_until_game
doc_to_visual: !function utils.minigrid_doc_to_visual
doc_to_text: !function utils.minigrid_doc_to_text
doc_to_target: !function utils.minigrid_doc_to_target
# The whole environment side is one registry name. observation_parser and
# action_parser are omitted on purpose: the loop falls back to the generic
# TemplateObservationParser and to an action parser built from the env's
# action_spec(). Model-side serving stays a CLI choice:
#   --agentic_model_server openai --agentic_model_server_args model=...,base_url=...
game_env: minigrid
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
  max_game_steps: 40
process_results: !function utils.minigrid_process_results
metric_list:
  - metric: minigrid_success
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: true
  - metric: minigrid_steps
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: false
  - metric: minigrid_invalid_actions
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: false
  - metric: minigrid_env_error
    aggregation: !function utils.minigrid_aggregate_mean
    higher_is_better: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  version: 0.1
  description: "MiniGrid game loop driven entirely by the generic env interface (registry env + default parsers, no task-local component code)"
