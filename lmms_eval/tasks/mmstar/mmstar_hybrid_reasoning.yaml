task: "mmstar_hybrid_reasoning"
include: mmstar.yaml
process_docs: !function utils.mmstar_hybrid_reasoning_docs
process_results: !function utils.mmstar_cot_process_results
tag: []
generation_kwargs:
  max_new_tokens: 16384
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices. The last line of your response should be of the following format: 'Answer: $LETTER' (without quotes) where LETTER is one of options. Think step by step before answering."
metric_list:
  - metric: logical reasoning
    aggregation: !function utils.mmstar_aggregate_results
    higher_is_better: true
  - metric: science & technology
    aggregation: !function utils.mmstar_aggregate_results
    higher_is_better: true
  - metric: math
    aggregation: !function utils.mmstar_aggregate_results
    higher_is_better: true
  - metric: average
    aggregation: !function utils.mmstar_aggregate_results
    higher_is_better: true
