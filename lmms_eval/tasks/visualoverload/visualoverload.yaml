task: visualoverload
dataset_path: paulgavrikov/visualoverload
test_split: test
output_type: generate_until
doc_to_visual: !function utils.visualoverload_doc_to_visual
doc_to_text: !function utils.visualoverload_doc_to_text
doc_to_messages: !function utils.visualoverload_doc_to_messages
doc_to_target: !function utils.visualoverload_doc_to_target
process_results: !function utils.visualoverload_process_results
metric_list:
  - metric: submission
    aggregation: !function utils.visualoverload_aggregate_results
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  do_sample: false
metadata:
  version: 1.0
